; spelunky 2 native 4:3
[aspect]
aspect_ratio = 1.3333334
world_projection = 1
no_letterbox = 1
cam_extents = 1

; aspect_globals = 1 correctly patches 0x22d0c4a0 and 0x22d0d620 to 4:3
aspect_globals = 1
proj_constants = 0
aspect_vectors = 0
runtime_immediates = 0

; turn OFF fake ui_quads that distorted the menu characters!
ui_quads = 0
ui_scale_x = 1.0
ui_scale_y = 1.0

; hud_fix is off
hud_fix = 0
hud_x_scale = 1.0

; every 2d element (hud icons, timer, menu/pause text, blur) is authored for a
; 1280x720 frame, but the canvas is now the whole 1280x960 window, so the whole
; 2d layer lands 1.3333 too tall. 1 = scale y by 720/960 = 0.75 at the one 2d
; draw call (0x22cc5d80), leaving elements that span the whole frame (the full
; screen fade / dim / blur quads) at full height so they keep covering the
; window. 0 = leave the 2d layer stretched.
ui_2d_scale = 1
ui_2d_scale_x = 1.0
; a cluster whose y box spans the frame from -ui_2d_edge to +ui_2d_edge is a
; fade / dim / blur fill and stays at full height; everything else scales,
; even art that overshoots the frame mid-zoom.
ui_2d_edge = 0.995
; 1 = decide fills per element: one at least 1.8 tall that touches an edge is
; a fade / dim / blur and keeps its full height (scaling it opens a band along
; that edge). 0 = the old per-vertex line, where a vertex past ui_2d_edge is
; left where it is - it protects fills too, but shears art that crosses the
; line, which is the 16:9 slice the guest saw on zoom transitions.
ui_2d_fill = 1
; 1 = split backing bars of equal height stacked at partial overlap (pause /
; confirm row boards) into separate elements so each stays on its text row.
; experimental, off until the run-10 quad boxes show the camp art is unaffected.
ui_2d_bars = 0
; 1 = clusters on the centre line (|x centre| <= 0.02) scale about y = 0 instead of their own centre, so pause / confirm text follows its shrunk board. run 11 tests this; set 0 to back it out.
ui_2d_center = 1
; heap scan for stray copies of the projection matrix. never matched in any
; logged run, and its unguarded reads crashed pin10 at startup. reads are now
; fault-safe, but it stays off.
live_scan = 0
; the scale is applied per element, not about the screen centre: quads whose
; centres sit within ui_2d_cluster of each other in y are one element (a text
; run, a row of icons). a batch is only pinned to the screen edge it hugs -
; keeping the distance the artist authored - when EVERY element in it is
; compact (<= ui_2d_pinspan tall), past ui_2d_pin from the centre AND out in a
; corner past ui_2d_pinx in x; that is the hud. mixed batches are artwork (the
; choose adventurer camp, banners, the pause menu) and every element in them
; scales about its own centre, which does not move a single position - that is
; what keeps those screens aligned with the scene behind them. the hud
; elements sit at authored mean 0.86-0.92 and stay pinned exactly as before.
; ui_2d_pinx keeps the camp rope's top segments (compact, past 0.85, but dead
; centre) from pinning and breaking the rope. set ui_2d_pin = 2 to disable
; pinning entirely.
ui_2d_pin = 0.85
ui_2d_pinspan = 0.35
ui_2d_cluster = 0.20
ui_2d_pinx = 0.30
; a glyph-sized quad (<= 0.12 tall, <= 0.06 wide) sitting further than this
; from the run so far starts a new element even when the centres are within
; ui_2d_cluster, so stacked text lines (pause rows sit 0.14 apart) keep their
; authored row positions instead of squeezing towards the block centre. only
; lines split - the run must already be 0.06 wide and 6 quads long - so art
; pieces and the camp rope (0.03 wide) never do. 0 disables the split.
ui_2d_rowgap = 0.05
; 1 = log every distinct 2d batch shape once (n, idx, x/y/z range, quad
; centres), plus every canvas change and the quad boxes of ropes/backdrops.
; 0 = quiet.
ui_2d_dump = 0

; alternative to ui_2d_scale: draw the hud inside a centred 16:9 viewport.
; device run 95818d0 did this at the wrong spot, so it letterboxed every later
; pass and never reached the icons. fixed in this build (the hook now wraps the
; real draw and restores the canvas viewport), but the two flags fix the same
; axis - never turn both on.
ui_letterbox = 0

; 13.5 = vanilla zoom: 7.2 tiles tall, fits inside a room. the camera's visible
; height is zoom*0.2667*2 tiles, so >= 15.0 is a full 8 tile room and leaves the
; vertical clamp with no valid range -> violent camera jut on level entry.
custom_zoom = 13.5
; android's 39-bit address space can't satisfy the game's heap hint, so it hangs
; re-rolling it. 1 = shrink the hint range (two one-byte patches in the exe).
heap_patch = 1
; the game mutes the sfx / music buses on the device and never restores them.
; 1 = push the local.cfg volumes back onto the buses for the first minute.
force_audio = 1
debug_log = 0
